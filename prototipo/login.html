<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Animalec</title>
  <link rel="icon" href="img/animalec.ico">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/app.js"></script>
</head>
<body data-pagina="login">
  <main>
    <section class="login">
      <img src="img/animalec.png" alt="Logótipo do Animalec">
      <h1 id="t-login">Área de gestão</h1>
      <p>Acesso reservado a administradores.</p>
      <form id="form-login">
        <div class="campo"><label for="utilizador">Utilizador</label><input id="utilizador" name="utilizador" required value="admin"></div>
        <div class="campo"><label for="password">Password</label><input id="password" name="password" type="password" required></div>
        <p id="erro-login" class="erro-form"></p>
        <button class="botao cheio" type="submit">Entrar</button>
        <small>Protótipo: utilizador <code>admin</code>, password <code>animalec</code>.</small>
      </form>
    </section>
  </main>
</body>
</html>
